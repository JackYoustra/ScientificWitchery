<svg viewBox="0 0 1400 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .system-bg { fill: #f1f3f5; stroke: #868e96; stroke-width: 2; }
      .agent-box { fill: #e7f5ff; stroke: #1971c2; stroke-width: 2; }
      .tool-box { fill: #fff3bf; stroke: #f59f00; stroke-width: 2; }
      .exec-box { fill: #ffe8cc; stroke: #fd7e14; stroke-width: 2; }
      .gpu-lock { fill: #ff8787; stroke: #c92a2a; stroke-width: 2; }
      .success { fill: #d3f9d8; stroke: #2f9e44; stroke-width: 2; }
      .data-box { fill: #f8f9fa; stroke: #495057; stroke-width: 2; }
      .optional { stroke-dasharray: 4,3; }

      .arrow { fill: none; stroke: #495057; stroke-width: 2.5; marker-end: url(#arrowhead); }
      .arrow-thick { fill: none; stroke: #495057; stroke-width: 3.5; marker-end: url(#arrowhead-thick); }
      .arrow-feedback { fill: none; stroke: #f59f00; stroke-width: 2.5; marker-end: url(#arrowhead-feedback); stroke-dasharray: 8,4; }
      .arrow-gpu { fill: none; stroke: #fa5252; stroke-width: 3; marker-end: url(#arrowhead-gpu); }

      .title { font: bold 18px sans-serif; fill: #212529; }
      .subtitle { font: bold 15px sans-serif; fill: #495057; }
      .text { font: 13px sans-serif; fill: #495057; }
      .small { font: 11px sans-serif; fill: #868e96; }
      .tiny { font: 10px sans-serif; fill: #adb5bd; }
      .badge { font: bold 11px sans-serif; }
      .badge-pct { fill: #f59f00; }
      .badge-always { fill: #2f9e44; }
      .gpu-label { font: bold 12px sans-serif; fill: #c92a2a; }
    </style>

    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057" />
    </marker>
    <marker id="arrowhead-thick" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 12 3, 0 6" fill="#495057" />
    </marker>
    <marker id="arrowhead-feedback" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f59f00" />
    </marker>
    <marker id="arrowhead-gpu" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#fa5252" />
    </marker>
  </defs>

  <!-- Title & Legend -->
  <text x="700" y="25" class="title" text-anchor="middle">KernelBench System Architecture &amp; Agent Flow</text>
  <text x="700" y="45" class="tiny" text-anchor="middle">201 logs • 41 configs • 3 levels (L1:59, L2:91, L3:30) • token limits 50k–10M</text>

  <!-- Legend -->
  <g transform="translate(990, 60)">
    <rect x="0" y="0" width="18" height="18" class="agent-box"/>
    <text x="23" y="14" class="small">Agent Decision</text>
    <rect x="0" y="24" width="18" height="18" class="exec-box"/>
    <text x="23" y="38" class="small">Tool Execution</text>
    <rect x="0" y="48" width="18" height="18" class="gpu-lock"/>
    <text x="23" y="62" class="small">GPU Locked</text>
    <path d="M 0 78 L 20 78" class="arrow-feedback"/>
    <text x="23" y="81" class="small">Feedback Loop</text>
  </g>

  <!-- SYSTEM CONTAINER -->
  <rect x="30" y="75" width="1340" height="1000" class="system-bg" rx="8"/>
  <text x="40" y="100" class="subtitle">SYSTEM: Inspect AI + Docker Sandbox (5090 sm_120)</text>

  <!-- INITIALIZATION PHASE -->
  <rect x="60" y="120" width="1280" height="90" class="data-box" rx="5"/>
  <text x="700" y="145" class="subtitle" text-anchor="middle">INITIALIZATION</text>
  <text x="80" y="170" class="text">1. Load Dataset: HuggingFace ScalingIntelligence/KernelBench</text>
  <text x="80" y="188" class="text">2. cudaify_prompt(): Inject optimization instructions (5090 target, CUDA 12.9, PyTorch 25.06-py3)</text>
  <text x="80" y="203" class="small">3. Environment: /materials/ptx_isa_8.7.md, CUTLASS 3.x, Triton 3.3.0, cuDNN 90701</text>

  <!-- Arrow from INIT to ReAct Loop -->
  <path d="M 700 210 L 700 230" class="arrow-thick"/>

  <!-- REACT LOOP CONTAINER -->
  <rect x="60" y="230" width="900" height="490" class="agent-box" rx="5"/>
  <text x="510" y="255" class="subtitle" text-anchor="middle">ReAct AGENT LOOP (5-20 attempts)</text>
  <text x="510" y="272" class="small" text-anchor="middle">Correctness mode: 5 max (39% of runs) • Runtime improvement mode: 20 max (61% of runs)</text>

  <!-- Agent States -->
  <g transform="translate(80, 290)">
    <!-- OBSERVE -->
    <rect x="0" y="0" width="840" height="70" class="agent-box" rx="4"/>
    <text x="420" y="25" class="subtitle" text-anchor="middle">① OBSERVE State</text>
    <text x="20" y="45" class="text">• System prompt + Problem description (model architecture to optimize)</text>
    <text x="20" y="62" class="text">• Previous tool results + Evaluation feedback (compile errors, correctness issues, speedup vs baseline)</text>

    <!-- THINK -->
    <path d="M 420 70 L 420 95" class="arrow"/>
    <rect x="0" y="95" width="840" height="60" class="agent-box" rx="4"/>
    <text x="420" y="120" class="subtitle" text-anchor="middle">② THINK (Reasoning)</text>
    <text x="20" y="140" class="text">Chain-of-thought reasoning about optimization strategy, profiling insights, next steps</text>

    <!-- DECIDE -->
    <path d="M 420 155 L 420 180" class="arrow"/>
    <rect x="0" y="180" width="840" height="85" class="agent-box" rx="4"/>
    <text x="420" y="205" class="subtitle" text-anchor="middle">③ DECIDE Tool Calls</text>
    <text x="20" y="225" class="text">Select tools to execute: bash commands (profiling/testing), code editing, web search, thinking</text>
    <text x="20" y="242" class="small">Context management: kevin_pruner (13%) keeps newest CoT + all summaries, hashes old dumps</text>
    <text x="20" y="257" class="small">Budget tracking (1%): Show token usage in system message</text>

    <!-- EXECUTE -->
    <path d="M 420 265 L 420 290" class="arrow"/>
    <rect x="0" y="290" width="840" height="55" class="exec-box" rx="4"/>
    <text x="420" y="313" class="subtitle" text-anchor="middle">④ EXECUTE Tools</text>
    <text x="420" y="332" class="text" text-anchor="middle">See "Tool Execution Zone" →</text>

    <!-- SUBMIT CHECK -->
    <path d="M 420 345 L 420 370" class="arrow"/>
    <rect x="250" y="370" width="340" height="55" class="agent-box" rx="4"/>
    <text x="420" y="392" class="subtitle" text-anchor="middle">⑤ SUBMIT Decision</text>
    <text x="420" y="410" class="small" text-anchor="middle">submit() called?</text>
    <text x="420" y="422" class="tiny" text-anchor="middle">(5% configs allow final_answer=True)</text>

  </g>

  <!-- Continue arrow - completely outside transform group -->
  <!-- From SUBMIT exit at (500, 715) -> left -> up -> back to top of ReAct -->
  <path d="M 500 715 L 40 715 L 40 255 L 60 255" class="arrow-feedback"/>
  <text x="25" y="485" class="small" text-anchor="middle" transform="rotate(-90 25 485)">NO: Continue</text>

  <!-- TOOL EXECUTION ZONE -->
  <rect x="990" y="290" width="350" height="430" class="tool-box" rx="5"/>
  <text x="1165" y="315" class="subtitle" text-anchor="middle">TOOL EXECUTION ZONE</text>

  <!-- Core Tools -->
  <g transform="translate(1010, 330)">
    <text x="0" y="0" class="text badge-always">CORE (Always Available):</text>

    <!-- gpu_serial_bash -->
    <rect x="0" y="8" width="310" height="85" class="gpu-lock" rx="3"/>
    <text x="155" y="28" class="subtitle" text-anchor="middle">gpu_serial_bash()</text>
    <text x="10" y="45" class="small">🔒 GPU EXCLUSIVE LOCK</text>
    <text x="10" y="60" class="small">All bash commands serialized</text>
    <text x="10" y="75" class="small">Examples: ncu, nsys, python tests,</text>
    <text x="10" y="88" class="small">compile checks, torch profiler</text>

    <!-- submit -->
    <rect x="0" y="100" width="150" height="45" class="exec-box" rx="3"/>
    <text x="75" y="120" class="text" text-anchor="middle">submit()</text>
    <text x="75" y="135" class="small" text-anchor="middle">Trigger evaluation</text>

    <!-- think -->
    <rect x="160" y="100" width="150" height="45" class="exec-box" rx="3"/>
    <text x="235" y="120" class="text" text-anchor="middle">think()</text>
    <text x="235" y="135" class="small" text-anchor="middle">Log reasoning</text>

    <!-- Optional Tools -->
    <text x="0" y="165" class="text badge-pct">OPTIONAL (Config Dependent):</text>

    <rect x="0" y="173" width="310" height="65" class="tool-box optional" rx="3"/>
    <text x="10" y="190" class="small">28%: text_editor / safe_text_editor</text>
    <text x="20" y="205" class="tiny">view, create, str_replace, insert</text>
    <text x="10" y="220" class="small">~3%: web_search() (Exa embedding)</text>
    <text x="10" y="233" class="tiny">Also seen: bash, exec, open_file, sed_utility</text>

    <!-- Management Features -->
    <text x="0" y="258" class="text badge-pct">MANAGEMENT (Rarely Used):</text>
    <rect x="0" y="266" width="310" height="45" class="tool-box optional" rx="3"/>
    <text x="10" y="283" class="small">13%: kevin_pruner (context mgmt)</text>
    <text x="10" y="298" class="small">1%: token_budget tracking</text>
  </g>

  <!-- Arrow from ReAct Loop to SCORING PIPELINE -->
  <path d="M 510 720 L 510 745" class="arrow-thick"/>
  <text x="540" y="735" class="text">YES: submit()</text>

  <rect x="60" y="745" width="900" height="155" class="gpu-lock" rx="5"/>
  <text x="510" y="770" class="subtitle" text-anchor="middle">SCORING PIPELINE (GPU LOCKED 🔒)</text>

  <g transform="translate(80, 785)">
    <text x="0" y="0" class="text" style="fill:#212529;">1. Read /workspace/model_new.py (fallback: /model_new.py)</text>
    <text x="0" y="20" class="text" style="fill:#212529;">2. Extract code → run_evaluation_in_container(custom_cuda, ref_arch_src)</text>
    <text x="0" y="40" class="text" style="fill:#212529;">3. Check pipeline: File exists? → Compiles? → Correct? → Benchmark runtime</text>
    <text x="0" y="60" class="text" style="fill:#212529;">4. Load baselines for (level, name): baseline_eager, baseline_compile, baseline_inductor, etc.</text>
    <text x="0" y="80" class="text" style="fill:#212529;">5. Calculate: speedup = min(all_baselines) / kernel_runtime</text>
    <text x="0" y="100" class="text" style="fill:#212529;">6. Log to metadata: submission_count++, is_best flag, attempt_idx, all baseline times</text>
  </g>

  <!-- DECISION DIAMOND -->
  <path d="M 510 900 L 510 935" class="arrow"/>
  <path d="M 510 935 L 590 980 L 510 1025 L 430 980 Z" class="data-box"/>
  <text x="510" y="975" class="text" text-anchor="middle">Pass &amp;</text>
  <text x="510" y="992" class="text" text-anchor="middle">Speedup?</text>

  <!-- FAILURE PATH (routes OUTSIDE ReAct box on right side to avoid overlap) -->
  <path d="M 430 980 L 320 980 L 320 950 L 980 950 L 980 255 L 960 255" class="arrow-feedback"/>
  <text x="990" y="600" class="small" text-anchor="middle" transform="rotate(-90 990 600)">ERROR: Retry</text>
  <rect x="150" y="920" width="140" height="120" class="data-box" rx="4" style="fill:#ffe3e3;"/>
  <text x="220" y="940" class="subtitle" text-anchor="middle">ERROR</text>
  <text x="160" y="960" class="small">Feedback:</text>
  <text x="160" y="975" class="small">• File not found</text>
  <text x="160" y="990" class="small">• Compile errors</text>
  <text x="160" y="1005" class="small">• Wrong output</text>
  <text x="160" y="1020" class="small">• Runtime stats</text>
  <text x="160" y="1033" class="tiny">→ Back to OBSERVE</text>

  <!-- SUCCESS PATH -->
  <path d="M 590 980 L 760 980" class="arrow"/>
  <rect x="760" y="920" width="200" height="120" class="success" rx="4"/>
  <text x="860" y="943" class="subtitle" text-anchor="middle">SUCCESS</text>
  <text x="860" y="960" class="subtitle" text-anchor="middle">(or Max Attempts)</text>
  <text x="770" y="983" class="small">• Best speedup saved</text>
  <text x="770" y="998" class="small">• All submissions logged</text>
  <text x="770" y="1013" class="small">• Metadata preserved</text>
  <text x="770" y="1028" class="small">• Runtime stats saved</text>

  <!-- FINAL AGGREGATION -->
  <path d="M 860 1040 L 860 1055 L 700 1055" class="arrow"/>
  <rect x="400" y="1048" width="600" height="20" class="success" rx="3"/>
  <text x="700" y="1062" class="small" text-anchor="middle">Epochs: 4 (min &amp; max reducers) • Metrics: accuracy, mean_runtime_of_passes, speedup_vs_best_baseline</text>

  <!-- CONFIG NOTE -->
  <rect x="990" y="745" width="350" height="145" class="data-box" rx="5"/>
  <text x="1165" y="770" class="subtitle" text-anchor="middle">CONFIG RANGES</text>
  <text x="1000" y="795" class="text">Token limits: 50k–10M</text>
  <text x="1010" y="810" class="small">(9 unique values, typical: 500k–1M)</text>
  <text x="1000" y="830" class="text">Max attempts:</text>
  <text x="1010" y="845" class="small">• 5 (correctness only)</text>
  <text x="1010" y="860" class="small">• 20 (runtime improvement)</text>
  <text x="1000" y="878" class="text">Early stopping:</text>
  <text x="1010" y="892" class="tiny">improving_metric(ε=0.02, patience=4)</text>

  <!-- GPU LOCK ANNOTATIONS -->
  <g transform="translate(990, 910)">
    <text x="0" y="0" class="gpu-label">GPU LOCKING STRATEGY:</text>
    <text x="0" y="18" class="small">🔒 gpu_exclusive_lock() serializes</text>
    <text x="0" y="33" class="small">ALL bash commands system-wide</text>
    <text x="0" y="48" class="small">to prevent profiling race conditions</text>
    <text x="0" y="68" class="small">Locked during:</text>
    <text x="10" y="83" class="tiny">• Any gpu_serial_bash() call</text>
    <text x="10" y="96" class="tiny">• Entire scoring pipeline</text>
    <text x="10" y="109" class="tiny">• run_evaluation_in_container()</text>
  </g>

</svg>